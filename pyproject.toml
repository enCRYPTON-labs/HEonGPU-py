[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.9"]
build-backend = "scikit_build_core.build"

[project]
name = "heongpu"
version = "0.1.0"
description = "Python bindings of HEonGPU, a GPU library for fully homomorphic encryption (BFV, CKKS and TFHE)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Alişah Özcan", email = "alisahozcan97@gmail.com" }]
maintainers = [{ name = "enCRYPTON-Labs" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22"]
keywords = [
    "homomorphic encryption",
    "fhe",
    "gpu",
    "cuda",
    "ckks",
    "bfv",
    "tfhe",
    "privacy",
    "cryptography",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/enCRYPTON-labs/HEonGPU-py"
Source = "https://github.com/enCRYPTON-labs/HEonGPU-py"
Issues = "https://github.com/enCRYPTON-labs/HEonGPU-py/issues"
HEonGPU = "https://github.com/enCRYPTON-labs/HEonGPU"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=4.0"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/heongpu"]
install.components = ["heongpu_python"]
# One wheel of the stable ABI for Python 3.12 and newer.
wheel.py-api = "cp312"
sdist.exclude = ["build", ".github"]

[tool.scikit-build.cmake.define]
HEONGPU_PY_HEONGPU_PROVIDER = { env = "HEONGPU_PY_HEONGPU_PROVIDER", default = "AUTO" }

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-m", "not slow"]
markers = [
    "slow: long running tests, for example bootstrapping; deselected by default, run them with '-m slow'",
    "nogpu: the test does not need a CUDA device",
]

[tool.black]
line-length = 80

[tool.ruff]
line-length = 80
target-version = "py310"
